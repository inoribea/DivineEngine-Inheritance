##############################################################################################################################

dns:
  enable: true
  cache-algorithm: arc
  prefer-h3: true
  ipv6: true
  enhanced-mode: redir-host
  fake-ip-filter-mode: blacklist
  fake-ip-range: 198.18.0.1/16
  listen: '[::]:7853'

  # 1. 引导解析（仅用于解析下方加密 DNS 服务器的域名）：改用国内高可用加密 DoT IP，彻底杜绝明文 UDP 53 泄露给光猫
  default-nameserver:
    - 'tls://223.5.5.5'
    - 'tls://1.12.12.12'

  # 2. 代理节点域名解析：避免下方 nameserver 走 #Proxy 时产生“先有鸡还是先有蛋”的死锁
  proxy-server-nameserver:
    - 'https://doh.pub/dns-query'
    - 'https://dns.alidns.com/dns-query'

  # 3. 直连出口解析：确保最终命中 DIRECT 的国内 CDN 解析到本地最优节点
  direct-nameserver:
    - 'https://doh.pub/dns-query'
    - 'https://dns.alidns.com/dns-query'

  # 4. 默认/海外解析：强制通过 #Proxy 加密隧道发出，上游光猫与公共 Wi-Fi 连你的 DNS 服务器域名 SNI 都无法窥探
  # 若替换为你的私人 DNS（支持 DoH / DoT / DoQ），保留末尾 #Proxy 即可全平台隐藏私人 DNS 特征：
  #   - 'quic://你的私人DNS域名:853#Proxy'
  #   - 'https://你的私人DNS域名/dns-query#Proxy'
  nameserver:
    - 'https://dns.quad9.net/dns-query#Proxy'
    - 'https://cloudflare-dns.com/dns-query#Proxy'

  # 5. 分流解析策略：国内域名与私有域名走国内加密 DoH，其余默认走上方加密隧道 nameserver
  nameserver-policy:
    "geosite:cn,private":
      - 'https://doh.pub/dns-query'
      - 'https://dns.alidns.com/dns-query'
    "rule-set:cn,private,bilibili,microsoft,apple,icloud":
      - 'https://doh.pub/dns-query'
      - 'https://dns.alidns.com/dns-query'

sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  sniff:
    HTTP:
      ports:
        - 80
        - 8080-8880
      override-destination: true
    TLS:
      ports:
        - 443
        - 8443
    QUIC:
      ports:
        - 443
        - 8443
  skip-domain:
    - hf-mirror.com
    - +.mijia.tech

##############################################################################################################################
