#### https://wiki.metacubex.one/config

##############################################################################################################################

# 代理端口
#port: 7880
#socks-port: 7881
#mixed-port: 7890
#redir-port: 7891
#tproxy-port: 7892

udp: true
ipv6: true
allow-lan: true 
mode: rule
geo-auto-update: false
bind-address: "*"
keep-alive-interval: 15
keep-alive-idle: 600
unified-delay: true
tcp-concurrent: true

listeners:
  - name: tproxy-in
    type: tproxy
    udp: true

tun:
  enable: true
  stack: mixed
  device: utun
  mtu: 1500
  dns-hijack:
    - any:53
  endpoint-independent-nat: true
  auto-route: true
  auto-redirect: false
  strict-route: false
  auto-detect-interface: true

external-controller: '0.0.0.0:9090'
# secret: '' # 建议在客户端或拼接脚本中注入密钥，防止公共 Wi-Fi 或上游光猫 pscan 探测 9090 端口读取连接记录
external-controller-cors:
  allow-origins:
    - '*'
  allow-private-network: true
profile:
  store-selected: true
  store-fake-ip: false
experimental:
  sniff-tls-sni: false
##############################################################################################################################
